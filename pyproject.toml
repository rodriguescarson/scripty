[project]
name = "scripty"
version = "0.1.0"
description = "Scripty — the continuity agent for script supervisors: finds prop, wardrobe and set continuity errors across takes and shows its own false-positive rate."
requires-python = ">=3.12"
dependencies = [
  "google-adk>=2.7",
  "google-genai>=1.30",
  "clickhouse-connect>=0.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "numpy>=1.26",
  "pydantic>=2",
  "python-dotenv>=1.0",
  "mcp>=1.10,<2",
  "httpx>=0.27",
]

[project.scripts]
scripty = "scripty.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripty"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
